[package]
name = "adhan-clock"
version = "3.4.1"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "adhan-clock"

[dependencies]
chrono = "0.4.44"
reqwest = {version = "0.10", default-features = false, features = ["rustls-tls", "blocking"]}
serde_json = "1.0.149"
slint = {version = "1.17.1", features = ["backend-android-activity-06"]}
rodio = {version = "0.22.2", default-features = false, features = ["vorbis", "playback", "tracing"]}
phf = { version = "0.14.0", features = ["macros"] }
backtrace = "0.3.76"

[build-dependencies]
slint-build = "1.17.1"
